<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập JWT Nimbus</title>
<link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head>
<body><main class="container py-5"><div class="card mx-auto p-4 shadow-sm" style="max-width:560px">
<p class="text-primary">TUẦN 10 · 24133045 · BÙI THANH PHÚC</p><h1 class="h3">JWT với Nimbus</h1><p>Đăng ký và đăng nhập bằng email để truy cập API với Bearer token.</p>
<form id="loginForm"><label for="email" class="form-label">Email</label><input id="email" class="form-control mb-3" type="email" autocomplete="username" required maxlength="100">
<label for="password" class="form-label">Mật khẩu</label><input id="password" class="form-control mb-3" type="password" autocomplete="current-password" required>
<button id="Login" class="btn btn-primary" type="submit">Đăng nhập</button></form>
<hr><details><summary>Tạo tài khoản mới</summary><form id="signupForm" class="mt-3">
<label for="fullName" class="form-label">Họ tên</label><input id="fullName" class="form-control mb-2" required maxlength="100">
<label for="signupEmail" class="form-label">Email</label><input id="signupEmail" class="form-control mb-2" type="email" required maxlength="100">
<label for="signupPassword" class="form-label">Mật khẩu (từ 6 ký tự)</label><input id="signupPassword" class="form-control mb-3" type="password" autocomplete="new-password" required minlength="6" maxlength="72">
<button class="btn btn-outline-primary" type="submit">Đăng ký</button></form></details>
<div id="feedback" class="mt-3" role="status" aria-live="polite"></div></div></main>
<script src="/js/vendor/jquery.min.js"></script><script src="/js/mainjs.js"></script></body></html>
